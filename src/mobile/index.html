<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f6f7" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:*; worker-src 'self' blob:"
    />
    <title>Guncat Work</title>
    <link rel="icon" href="./resources/app-icon.png" />
    <script>
      window.__GUNCAT_NATIVE__ = window.__GUNCAT_NATIVE__ || {
        token: '__GUNCAT_TOKEN__',
        version: '__GUNCAT_VERSION__'
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-placeholder">
        <div class="boot-title">Guncat Work</div>
        <div class="boot-hint">正在启动…</div>
      </div>
    </div>
    <style>
      #boot-placeholder {
        display: grid;
        place-content: center;
        height: 100vh;
        gap: 6px;
        text-align: center;
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #6b6b73;
      }
      #boot-placeholder .boot-title {
        font-size: 20px;
        font-weight: 600;
        color: #1c1c1e;
      }
      #boot-placeholder .boot-hint {
        font-size: 13px;
      }
    </style>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
